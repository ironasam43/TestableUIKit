name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    name: Swift Package Unit Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run swift test
        run: swift test

  build-app:
    name: Build iOS DemoApp
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build DemoApp (Simulator)
        run: |
          xcodebuild build \
            -scheme TestableUIKitDemo \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty || true

  probe-simulator:
    name: Phase 0 PoC - Simulator Boot, App Launch & Loopback
    runs-on: macos-latest
    needs: [build-app]

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build DemoApp (Simulator)
        run: |
          echo "=== STEP: xcodebuild ==="
          xcodebuild build \
            -scheme TestableUIKitDemo \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=build/Build/Products/Debug-iphonesimulator

      - name: Boot Simulator (get first available device)
        run: |
          echo "=== STEP: simctl boot ==="
          DEVICE=$(xcrun simctl list devices available -j | jq -r '.devices[][] | select(.state == "Shutdown") | .name' | head -1)
          echo "Booting device: $DEVICE"
          echo "DEVICE_NAME=$DEVICE" >> $GITHUB_ENV
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b --timeout 300

      - name: Install DemoApp
        run: |
          echo "=== STEP: simctl install ==="
          xcrun simctl install booted \
            build/Build/Products/Debug-iphonesimulator/DemoApp.app

      - name: Launch DemoApp
        run: |
          echo "=== STEP: simctl launch ==="
          xcrun simctl launch --terminate-running-process booted com.testable.TestableUIKitDemo
          sleep 5

      - name: Check process is running (lifecycle indicator)
        run: |
          echo "=== STEP: process check ==="
          xcrun simctl spawn booted launchctl list | grep -i com.testable.TestableUIKitDemo \
            && echo "=== PROCESS FOUND ===" \
            || echo "=== WARNING: process not found ==="

      - name: Wait for /ping (max 60s)
        run: |
          echo "=== STEP: loopback ping ==="
          for i in $(seq 1 20); do
            echo "Attempt $i: http://localhost:8888/ping"
            curl -sf http://localhost:8888/ping && echo "=== PING OK ===" && exit 0
            sleep 3
          done
          echo "=== TIMEOUT: /ping unreachable ===" && exit 1

      - name: Shutdown Simulator
        if: always()
        run: |
          echo "=== STEP: cleanup ==="
          xcrun simctl shutdown "${{ env.DEVICE_NAME }}" || true
