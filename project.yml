name: TestableUIKitDemo

targets:
  TestableUIKit:
    type: framework
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/TestableUIKit
    settings:
      DEFINES_MODULE: YES
      PRODUCT_MODULE_NAME: TestableUIKit
      PRODUCT_NAME: TestableUIKit
      PRODUCT_BUNDLE_IDENTIFIER: dev.plateworks.TestableUIKit
      SKIP_INSTALL: NO
      GENERATE_INFOPLIST_FILE: YES

  DemoApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DemoApp
    dependencies:
      - target: TestableUIKit
    info:
      path: DemoApp/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.plateworks.TestableUIKitDemo
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_IDENTITY: ""
      PROVISIONING_PROFILE: ""

schemes:
  TestableUIKitDemo:
    build:
      targets:
        TestableUIKit: [build]
        DemoApp: [build]
    run:
      config: Debug
      targets:
        - DemoApp
